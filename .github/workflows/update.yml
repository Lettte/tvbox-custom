name: Update TVBox config

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest jsm.json
        run: |
          curl -L --fail \
            https://raw.githubusercontent.com/qist/tvbox/master/jsm.json \
            -o jsm-upstream.json

      - name: Merge custom sites
        run: |
          python3 - <<'PY'
          import json

          BASE = "https://raw.githubusercontent.com/qist/tvbox/master/"

          def fix_relative(value):
              if isinstance(value, dict):
                  return {k: fix_relative(v) for k, v in value.items()}

              if isinstance(value, list):
                  return [fix_relative(v) for v in value]

              if isinstance(value, str):
                  if value.startswith("./"):
                      return BASE + value[2:]

                  value = value.replace(
                      "$$$./",
                      "$$$" + BASE
                  )

                  return value

              return value

          with open("jsm-upstream.json", "r", encoding="utf-8") as f:
              base = json.load(f)

          # 把 qist 配置里的 ./ 相对路径，
          # 改成仍然指向 qist 仓库的绝对地址。
          base = fix_relative(base)

          with open("custom-sites.json", "r", encoding="utf-8") as f:
              custom = json.load(f)

          valid = []
          for site in custom:
              text = json.dumps(site, ensure_ascii=False)

              if "__FILL_" not in text:
                  valid.append(site)

          base.setdefault("sites", []).extend(valid)

          with open("jsm-plus.json", "w", encoding="utf-8") as f:
              json.dump(
                  base,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print("upstream sites:", len(base["sites"]) - len(valid))
          print("custom sites:", len(valid))
          print("total sites:", len(base["sites"]))
          PY

      - name: Commit updated config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jsm-plus.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update TVBox config"
            git push
          fi
